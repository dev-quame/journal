<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="light">
    <div class="container">
      <header>
        <h1>Settings</h1>
        <nav>
          <a href="index.html">Entries</a>
          <a href="settings.html" class="active">Settings</a>
        </nav>
      </header>

      <main>
        <!-- Theme Selector -->
        <div class="settings-section">
          <h2>Appearance</h2>
          <div class="theme-selector">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect">
              <option value="light">☀️ Light</option>
              <option value="sepia">📜 Sepia</option>
              <option value="forest">🌲 Forest</option>
              <option value="midnight">🌙 Midnight Blue</option>
              <option value="red">🔥 Red Ember</option>
            </select>
          </div>
        </div>

        <hr />

        <!-- Templates Section -->
        <div class="settings-section">
          <div class="settings-header">
            <h2>Templates</h2>
            <button id="addTemplateBtn" class="btn-primary">
              + Add Template
            </button>
          </div>
          <div id="templatesList" class="templates-list">
            <!-- Templates will be rendered here -->
          </div>

          <!-- Template Import/Export -->
          <div class="template-actions">
            <button id="exportTemplatesBtn" class="btn-secondary">
              📤 Export Templates
            </button>
            <button id="importTemplatesBtn" class="btn-secondary">
              📥 Import Templates
            </button>
            <input
              type="file"
              id="importTemplatesFile"
              accept=".json"
              style="display: none"
            />
          </div>
        </div>

        <hr />

        <!-- Data Backup Section -->
        <div class="settings-section">
          <h2>Data Backup</h2>
          <div class="backup-actions">
            <button id="exportAllDataBtn" class="btn-primary">
              💾 Export All Data (Backup)
            </button>
            <button id="importAllDataBtn" class="btn-secondary">
              📂 Import Data (Restore)
            </button>
            <input
              type="file"
              id="importAllDataFile"
              accept=".json"
              style="display: none"
            />
          </div>
          <p class="settings-hint">
            Last backup: <span id="lastBackupDate">Never</span>
          </p>
        </div>

        <hr />

        <!-- Danger Zone -->
        <div class="danger-zone">
          <h3>Danger Zone</h3>
          <button id="clearAllDataBtn" class="btn-danger">
            Delete All Journal Entries
          </button>
        </div>
      </main>
    </div>

    <!-- Modal for template editor -->
    <div id="templateModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="templateModalTitle">Add Template</h2>
        <form id="templateForm">
          <div class="form-group">
            <label for="templateName">Template Name</label>
            <input
              type="text"
              id="templateName"
              required
              placeholder="e.g., Forex Trade, Daily Reflection"
            />
          </div>
          <div id="fieldsList">
            <h4>Fields</h4>
            <div id="fieldsContainer">
              <!-- Dynamic field inputs go here -->
            </div>
            <button type="button" id="addFieldBtn" class="btn-secondary">
              + Add Field
            </button>
          </div>
          <button type="submit" class="btn-primary">Save Template</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
