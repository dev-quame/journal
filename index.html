<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body data-theme="light">
    <div class="container">
      <header>
        <h1>Journal</h1>
        <nav>
          <a href="index.html" class="active">Entries</a>
          <a href="settings.html">Settings</a>
        </nav>
      </header>

      <main>
        <!-- Backup Banner -->
        <div id="backupBanner" class="backup-banner" style="display: none">
          <p>
            📦 <span id="backupDaysText">Last backup was over 30 days ago</span>
          </p>
          <div>
            <button id="exportBackupBtn" class="btn-secondary-sm">
              Export Data
            </button>
            <button id="dismissBackupBtn" class="btn-secondary-sm">
              Dismiss for 7 days
            </button>
          </div>
        </div>

        <!-- Action bar -->
        <div class="action-bar">
          <button id="quickEntryBtn" class="btn-quick">⚡ Quick Entry</button>
          <button id="newEntryBtn" class="btn-primary">+ New Entry</button>
        </div>

        <!-- Filters bar -->
        <div class="filters-bar">
          <div class="search-group">
            <input
              type="text"
              id="searchInput"
              placeholder="Search entries..."
              class="search-input"
            />
          </div>
          <div class="filter-group">
            <select id="templateFilter" class="filter-select">
              <option value="all">All templates</option>
            </select>
            <select id="dateFilter" class="filter-select">
              <option value="all">All time</option>
              <option value="7days">Last 7 days</option>
              <option value="30days">Last 30 days</option>
              <option value="this-month">This month</option>
              <option value="custom">Custom range</option>
            </select>
          </div>
          <div
            id="customDateRange"
            class="custom-date-range"
            style="display: none"
          >
            <input type="date" id="startDate" />
            <span>to</span>
            <input type="date" id="endDate" />
            <button id="applyDateRange" class="btn-secondary-sm">Apply</button>
          </div>
        </div>

        <!-- Entries -->
        <div id="entriesList" class="entries-list"></div>

        <!-- Empty state -->
        <div id="emptyState" class="empty-state" style="display: none">
          <p>No entries found.</p>
          <button id="clearFiltersBtn" class="btn-secondary">
            Clear filters
          </button>
        </div>

        <div class="keyboard-hint">
          ⌨️ N = New entry | Esc = Close | Ctrl+S = Save
        </div>
      </main>
    </div>

    <!-- Tour Hint -->
    <div id="tourHint" class="tour-hint" style="display: none">
      <span class="close-hint" id="closeTourHint">✖</span>
      <strong>👋 Welcome to Journal!</strong><br />
      Go to <strong>Settings</strong> to create your first template and set a
      default for Quick Entry.
    </div>

    <!-- Full Entry Modal -->
    <div id="entryModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">New Entry</h2>
        <form id="entryForm">
          <div class="form-group">
            <label for="templateSelect">Template</label>
            <select id="templateSelect" required>
              <option value="">-- Select a template --</option>
            </select>
          </div>
          <div id="dynamicFields"></div>
          <div class="form-group">
            <label for="journalText">Journal / Notes</label>
            <textarea
              id="journalText"
              rows="6"
              placeholder="Write your thoughts, rationale, or any notes here..."
            ></textarea>
          </div>

          <!-- Image Upload -->
          <div class="form-group">
            <label for="entryImage">Screenshot / Image</label>
            <input type="file" id="entryImage" accept="image/*" />
            <div
              id="imagePreviewContainer"
              style="margin-top: 0.5rem; display: none"
            >
              <img
                id="imagePreview"
                style="max-width: 100%; max-height: 200px; border-radius: 6px"
              />
              <button
                type="button"
                id="removeImageBtn"
                class="btn-secondary-sm"
                style="display: block; margin-top: 0.25rem"
              >
                ✖ Remove image
              </button>
            </div>
          </div>

          <!-- Version History -->
          <div
            id="versionHistoryContainer"
            class="version-history"
            style="display: none"
          >
            <hr />
            <button type="button" id="undoVersionBtn" class="btn-secondary-sm">
              ↩️ Undo to previous version
            </button>
            <span
              id="versionInfo"
              style="font-size: 0.7rem; margin-left: 0.5rem"
            ></span>
          </div>

          <button type="submit" class="btn-primary">Save Entry</button>
        </form>
      </div>
    </div>

    <!-- Quick Entry Modal -->
    <div id="quickEntryModal" class="modal">
      <div class="modal-content modal-compact">
        <span class="close">&times;</span>
        <h2>Quick Entry</h2>
        <p class="quick-template-info">
          Using template: <span id="quickTemplateName"></span>
        </p>
        <form id="quickEntryForm">
          <div id="quickDynamicFields"></div>
          <div class="form-group">
            <label for="quickJournalText">Quick notes</label>
            <textarea
              id="quickJournalText"
              rows="4"
              placeholder="Add a quick note..."
            ></textarea>
          </div>
          <div class="quick-actions">
            <button type="submit" class="btn-primary">Save</button>
            <button
              type="button"
              id="quickEntryFullEditBtn"
              class="btn-secondary"
            >
              Edit full entry instead
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Image Lightbox (for viewing full images) -->
    <div id="imageLightbox" class="modal">
      <div
        class="modal-content"
        style="
          max-width: 90%;
          max-height: 90%;
          padding: 0;
          background: transparent;
        "
      >
        <span
          class="close"
          id="lightboxClose"
          style="
            color: white;
            font-size: 2rem;
            position: fixed;
            top: 1rem;
            right: 1rem;
          "
          >&times;</span
        >
        <img
          id="lightboxImage"
          style="
            max-width: 100%;
            max-height: 90vh;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
          "
        />
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then((reg) => console.log("Service Worker registered", reg))
          .catch((err) => console.log("Service Worker failed", err));
      }
    </script>
  </body>
</html>
